name: ChopKnife
options:
  bundleIdPrefix: fun.gzowo
  deploymentTarget:
    iOS: "17.0"
targets:
  ChopKnife:
    type: application
    platform: iOS
    sources:
      - ChopKnife
    info:
      path: ChopKnife/Info.plist
      properties:
        CFBundleDisplayName: Nóż
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "Kamera śledzi, gdzie trzymasz telefon, żeby nóż w grze ruszał się razem z ręką."
        NSLocalNetworkUsageDescription: "Telefon łączy się z grą na Macu w tej samej sieci Wi-Fi."
        NSBonjourServices: [_chop._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.gzowo.chopknife
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
